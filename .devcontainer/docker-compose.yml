services:
  web:
    image: php:8.4-apache
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html:cached
      - ./php-custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - ogspy-network
    depends_on:
      - db

  db:
    image: mariadb:12.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ogspy_root
      MYSQL_DATABASE: ogspy
      MYSQL_USER: ogspy_user
      MYSQL_PASSWORD: ogspy_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ogspy-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: ogspy_user
      PMA_PASSWORD: ogspy_password
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - ogspy-network

volumes:
  mariadb_data:

networks:
  ogspy-network:
    driver: bridge
