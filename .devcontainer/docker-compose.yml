name: ogspy_devcontainer

services:
  db:
    image: mariadb:13.0
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-ogspy}
      MARIADB_USER: ${DB_USER:-ogspy}
      MARIADB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ogspy-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ogspy-web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ogspy}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ogspy}
      DB_PREFIX: ${DB_PREFIX:-ogspy_}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ports:
      - "${OGSPY_HTTP_PORT:-8080}:80"
    volumes:
      - "..:/var/www/html"
    networks:
      - ogspy-net
    init: true

networks:
  ogspy-net:
    driver: bridge

volumes:
  db_data:
    driver: local
