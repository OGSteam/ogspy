version: '3.8'
services:
  db:
    image: mariadb:latest
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ogspy
      MYSQL_USER: ogspy
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ogspy-net

  ogspy-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ogspy-web
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - "${PWD}/..:/var/www/html"
    networks:
      - ogspy-net

networks:
  ogspy-net:
    driver: bridge

volumes:
  db_data:
    driver: local
