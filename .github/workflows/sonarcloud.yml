name: SonarCloud Analysis
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ogspy-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      OGSPY_TEST_DB_HOST: 127.0.0.1
      OGSPY_TEST_DB_USER: root
      OGSPY_TEST_DB_PASSWORD: ogspy-test-password
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
     
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.4'
            coverage: xdebug
            
      - name: Install dependencies with composer
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
          
      - name: Run tests with PHPUnit (coverage)
        id: phpunit
        run: |
          # Production: run tests with Xdebug coverage enabled (minimal output)
          php -d xdebug.mode=coverage -d memory_limit=512M vendor/bin/phpunit

     
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
