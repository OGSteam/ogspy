name: SonarCloud Analysis
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
     
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.4'
            coverage: xdebug
            
      - name: Install dependencies with composer
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
          
      - name: Show PHP / Xdebug info
        run: |
          php -v
          echo "--- PHP Modules ---"
          php -m | grep -i xdebug || echo "Xdebug not found in modules"
          echo "--- Xdebug Configuration ---"
          php -i | grep -i xdebug || echo "No xdebug configuration found"
          echo "XDEBUG_MODE=${XDEBUG_MODE:-<not-set>}"

      - name: Run tests with phpunit/phpunit
        continue-on-error: true
        id: phpunit
        run: |
          echo "Running PHPUnit with coverage..."
          php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-clover=coverage.xml --verbose
          echo "PHPUnit exit code: $?"

      - name: Fix code coverage paths
        run: |
          if [ -f coverage.xml ]; then
            sed -i "s@$GITHUB_WORKSPACE@/github/workspace/@g" coverage.xml
          else
            echo "coverage.xml not found, skipping path fix"
          fi

      - name: Debug coverage file
        run: |
          echo "Working directory: $(pwd)"
          echo "List files:"; ls -la
          if [ -f coverage.xml ]; then
            echo "coverage.xml exists, showing first 40 lines:"; head -n 40 coverage.xml
            echo "coverage.xml size: $(wc -c < coverage.xml) bytes"
          else
            echo "ERROR: coverage.xml not found"
            exit 1
          fi

      - name: Upload coverage.xml as artifact (if present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
     
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
