name: SonarCloud Analysis
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
     
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.4'
            coverage: xdebug
            
      - name: Install dependencies with composer
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
          
      - name: Show PHP / Xdebug info
        run: |
          php -v
          echo "--- PHP Modules ---"
          php -m | grep -i xdebug || echo "Xdebug not found in modules"
          echo "--- Xdebug Configuration ---"
          php -i | grep -i xdebug || echo "No xdebug configuration found"
          echo "XDEBUG_MODE=${XDEBUG_MODE:-<not-set>}"

      - name: Run tests with phpunit/phpunit
        continue-on-error: false
        id: phpunit
        run: |
          echo "Running PHPUnit with coverage..."
          echo "PWD: $(pwd)"
          echo "phpunit.xml exists: $(test -f phpunit.xml && echo 'yes' || echo 'no')"
          
          # Show what tests would run
          echo "=== Available tests ==="
          php vendor/bin/phpunit --list-tests || true
          
          # Run PHPUnit with coverage - use testdox for better visibility
          echo "=== Running PHPUnit ==="
          php -d xdebug.mode=coverage -d memory_limit=512M vendor/bin/phpunit --testdox
          phpunit_exit=$?
          echo "PHPUnit exit code: $phpunit_exit"
          
          # List all XML files to debug
          echo "=== XML files in directory ==="
          ls -la *.xml 2>/dev/null || echo "No XML files found"
          
          # Check if coverage.xml was created
          if [ -f coverage.xml ]; then
            echo "✓ coverage.xml generated successfully"
            ls -lh coverage.xml
          else
            echo "✗ ERROR: coverage.xml was NOT generated"
            echo "Checking if PHPUnit tried to write it elsewhere..."
            find . -name "coverage.xml" -type f 2>/dev/null || echo "Not found anywhere"
            
            echo "=== Checking for errors in test run ==="
            echo "Tests ran: Check above for count"
            echo "Expected: 21 tests"
            exit 1
          fi
          
          exit $phpunit_exit

      - name: Fix code coverage paths
        run: |
          if [ -f coverage.xml ]; then
            sed -i "s@$GITHUB_WORKSPACE@/github/workspace/@g" coverage.xml
          else
            echo "coverage.xml not found, skipping path fix"
          fi

      - name: Debug coverage file
        run: |
          echo "Working directory: $(pwd)"
          echo "List files:"; ls -la
          if [ -f coverage.xml ]; then
            echo "coverage.xml exists, showing first 40 lines:"; head -n 40 coverage.xml
            echo "coverage.xml size: $(wc -c < coverage.xml) bytes"
          else
            echo "ERROR: coverage.xml not found"
            exit 1
          fi

      - name: Upload coverage.xml as artifact (if present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
     
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
