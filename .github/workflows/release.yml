name: OGSpy Package and Release

on:
  push:
    branches: [develop]
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout OGSpy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup PHP 8.4 with Xdebug
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
      with:
        php-version: '8.4'
        coverage: xdebug
        extensions: mysqli, json, mbstring, openssl, zlib, zip

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run unit tests
      run: php -d xdebug.mode=coverage vendor/bin/phpunit

  package:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout OGSpy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        fetch-tags: true

    - name: Propose snapshot version
      if: github.ref == 'refs/heads/develop'
      id: snapshot_version
      uses: codacy/git-version@5cabe6920ad6a182ba6d653ee8cb5ec65b8b4cfd # 2.9.0
      with:
        release-branch: master
        dev-branch: develop

    - name: Validate release tag
      if: startsWith(github.ref, 'refs/tags/')
      id: release_version
      shell: bash
      run: |
        version="${GITHUB_REF_NAME}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tags must use MAJOR.MINOR.PATCH without a prefix: $version"
          exit 1
        fi

        git fetch origin master:refs/remotes/origin/master
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
          echo "Release tag $version does not point to a commit on master"
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Resolve package version
      id: version
      shell: bash
      env:
        SNAPSHOT_VERSION: ${{ steps.snapshot_version.outputs.version }}
        RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version="$RELEASE_VERSION"
        else
          version="$SNAPSHOT_VERSION"
        fi

        if [[ -z "$version" ]]; then
          echo "Unable to resolve the package version"
          exit 1
        fi

        echo "Packaging OGSpy $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
      with:
        php-version: '8.4'
        extensions: mysqli, json, mbstring, openssl, zlib, zip

    - name: Install production dependencies
      run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '26'
        cache: npm

    - name: Install JavaScript dependencies
      run: npm ci --ignore-scripts

    - name: Package Chart.js browser bundle
      run: cp node_modules/chart.js/dist/chart.umd.js js/chart.js

    - name: Remove JavaScript dependencies
      run: rm -rf node_modules

    - name: Set packaged application version
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        php <<'PHP'
        <?php
        $path = 'install/version.php';
        $contents = file_get_contents($path);
        $replacement = '$ogspy_version = "' . getenv('PACKAGE_VERSION') . '";';
        $updated = preg_replace('/\$ogspy_version = "[^"]+";/', $replacement, $contents, 1, $count);

        if ($updated === null || $count !== 1 || file_put_contents($path, $updated) === false) {
            fwrite(STDERR, "Unable to update the packaged OGSpy version\n");
            exit(1);
        }
        PHP

    - name: Checkout Xtense
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ogsteam/mod-xtense
        ref: master
        path: mod/xtense

    - name: Checkout AutoUpdate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ogsteam/mod-autoupdate
        ref: master
        path: mod/autoupdate

    - name: Verify release package inputs
      run: test -s js/chart.js && test -f vendor/autoload.php && test -f install/index.php

    - name: Create package
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        archive="$RUNNER_TEMP/ogspy-${PACKAGE_VERSION}.zip"
        zip -r "$archive" . \
          -x '*.git*' '*.vscode*' '*.docker*' '.devcontainer*' \
             'sonar-project.properties' '.editorconfig' 'composer.*' \
             'package.json' 'package-lock.json' 'tests*' 'dev.cmd' \
             'tools/' 'tools/*'

    - name: Verify package contents
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        archive="$RUNNER_TEMP/ogspy-${PACKAGE_VERSION}.zip"
        test -s "$archive"

        if unzip -Z1 "$archive" | grep -Eq '^(dev\.cmd|tools/)'; then
          echo "Development tools must not be present in $archive"
          exit 1
        fi

        if ! unzip -p "$archive" install/version.php | grep -Fq \
          "\$ogspy_version = \"${PACKAGE_VERSION}\";"; then
          echo "The packaged application version does not match $PACKAGE_VERSION"
          exit 1
        fi

    - name: Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ogspy-${{ steps.version.outputs.version }}
        path: ${{ runner.temp }}/ogspy-${{ steps.version.outputs.version }}.zip
        if-no-files-found: error
        retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ogspy-${{ needs.package.outputs.version }}
        path: release-package

    - name: Create draft GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.package.outputs.version }}
      run: |
        gh release create "$RELEASE_VERSION" \
          "release-package/ogspy-${RELEASE_VERSION}.zip#OGSpy ${RELEASE_VERSION}" \
          --draft \
          --generate-notes \
          --title "OGSpy ${RELEASE_VERSION}" \
          --verify-tag
