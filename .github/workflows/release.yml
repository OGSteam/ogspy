name: OGSpy Release

on:
  push:
    branches: [ "develop" , "master"]

permissions:
  contents: read

jobs:
  package:

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name : Checkout OGSPY
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}   # checkout the correct branch name
        fetch-depth: 0
        fetch-tags: true

    - name: Git Version
      id: version
      # You may pin to the exact commit or the version.
      # uses: codacy/git-version@fa06788276d7492a2af01662649696d249ecf4cb
      uses: codacy/git-version@2.9.0
      with:
        # The name of the release branch
        release-branch: master
        # The name of the dev branch
        dev-branch: develop
        # The prefix to use in the version
        #prefix: # optional

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mysqli, json, mbstring, openssl, zlib, zip

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install JavaScript dependencies
      run: npm ci --ignore-scripts

    - name: Package Chart.js browser bundle
      run: cp node_modules/chart.js/dist/chart.umd.js js/chart.js

    - name: Remove JavaScript dependencies
      run: rm -rf node_modules

    - name: Replace Version
      uses: jacobtomlinson/gha-find-replace@v3
      with:
          include : 'install/version.php'
          find : '\$ogspy_version = "[^"]+";'
          replace: '$$ogspy_version = "${{ steps.version.outputs.version }}";'
          regex: true

    - name: Checkout Xtense
      uses: actions/checkout@v7
      with:
        repository: 'ogsteam/mod-xtense'
        ref: 'master'
        path: 'mod/xtense'

    - name: Checkout AutoUpdate
      uses: actions/checkout@v7
      with:
        repository: 'ogsteam/mod-autoupdate'
        ref: 'master'
        path: 'mod/autoupdate'

    - name: Verify release package inputs
      run: test -s js/chart.js && test -f vendor/autoload.php && test -f install/index.php

    - name: Zip Release
      # You may pin to the exact commit or the version.
      # uses: TheDoctor0/zip-release@a24011d8d445e4da5935a7e73c1f98e22a439464
      uses: TheDoctor0/zip-release@0.7.6
      with:
        # Filename for archive
        filename: ogspy-${{ steps.version.outputs.version }}.zip
        # Base path for archive files
        #path: # optional, default is .
        # Working directory before zipping
        #directory: # optional, default is .
        # List of excluded files / directories
        exclusions: '*.git* *.vscode* *.docker* .devcontainer* sonar-project.properties .editorconfig composer.* package.json package-lock.json tests*'
        # List of excluded files / directories with recursive wildcards (only applies on Windows with `zip` type)
        #recursive_exclusions: # optional, default is
        # Provide any custom parameters to the command
        #custom: # optional, default is
        # Tool to use for archiving
        #type: # optional, default is zip

    - name: Upload release package
      uses: actions/upload-artifact@v7
      with:
        name: ogspy-${{ steps.version.outputs.version }}
        path: ogspy-${{ steps.version.outputs.version }}.zip
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: ogspy-${{ needs.package.outputs.version }}
        path: release-package

    - uses: ncipollo/release-action@v1
      with:
        name : OGSpy ${{ needs.package.outputs.version }}
        draft: true
        artifacts: "release-package/ogspy-${{ needs.package.outputs.version }}.zip"
        artifactContentType: application/zip
        body : "To be Completed"
        tag : ${{ needs.package.outputs.version }}
